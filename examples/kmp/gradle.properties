# The Kotlin/Native compiler runs inside the Gradle daemon; Gradle's default 512 MiB heap and 384 MiB
# metaspace run out on repeated links ("OutOfMemoryError: Metaspace").
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
# nativeMain calls the cinterop binding for several targets at once, which needs KGP to commonize it.
kotlin.mpp.enableCInteropCommonization=true
