org.gradle.configuration-cache=true
# The Kotlin/Native versions binding generation supports: the index exporter is compiled once per version,
# against that version's compiler jar, and runs in the distribution of the same version. Every patch
# release; konanHome must name one of them. See src/indexExporter/compat for what differs between them.
kotlinNativeVersions=2.0.0,2.0.10,2.0.20,2.0.21,2.1.0,2.1.10,2.1.20,2.1.21,2.2.0,2.2.10,2.2.20,2.2.21,2.3.0,2.3.10,2.3.20,2.3.21,2.4.0,2.4.10,2.4.20,2.4.21
# The default among them: what kotlin-native-utils, KGP and the tests are built against, and what
# kotlinNativeDistribution() names in a project without the Kotlin plugin.
kotlinNativeVersion=2.4.20
